# Host configuration for the AM server
host: "am.wso2.com"
host_ip: "127.0.0.1"

# Gateway hostname configuration (used in tests)
gw_hostname: "gw.wso2.com"

# Git configuration
git_user_name: ""
git_user_password: ""
git_repo: ""
git_branch: "main"

# AWS S3 bucket configuration
aws_s3_bucket: "apim-ui-testing"
aws_s3_access_key: ""
aws_s3_secret_key: ""
aws_s3_region: "us-east-1"
# Optional S3 prefix from the pipeline; empty falls back to a timestamped path.
s3_prefix: ""

# Optional comma-separated Cypress spec paths/globs (relative to tests/).
# Empty = run the full suite. Set by the Jenkins pipeline via --set.
test_specs: ""
